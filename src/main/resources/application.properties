spring.application.name=cremo
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bdDeli}?useSSL=${DB_SSL:false}&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=10000&tcpKeepAlive=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

spring.jackson.serialization.write-dates-as-timestamps=false

# Limpia ventas e inventarios cada 3 dias desde el arranque (72 horas).
app.data-reset.interval-ms=${DATA_RESET_INTERVAL_MS:259200000}